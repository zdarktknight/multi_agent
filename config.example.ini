[logging]
# DEBUG 额外记录模板段落、解析和注册表查询；INFO 记录主要输入输出和步骤进度。
level = INFO
# 留空只输出控制台日志。
file = logs/zhuge_agent.log

[llm]
# 支持 OpenAI 兼容接口，包括其他供应商和本地模型服务。
# openai 调用真实 API；fixture 使用离线演示响应。
provider = openai
api_key = 
base_url = https://litellm.mybigai.ac.cn/
model = gpt-4.1-mini-2025-04-14
timeout_seconds = 60
# 默认 urllib；企业 LiteLLM/网关如需 OpenAI SDK + httpx，可改为 openai_sdk。
transport = urllib
# 内网网关或自签证书场景可设为 false；公网 OpenAI 建议保持 true。
verify_ssl = true
# OpenAI 标准参数之外的模型/网关扩展请求体，必须是 JSON 对象。
# 例如 Qwen3/vLLM 关闭 thinking:
# extra_body = {"chat_template_kwargs": {"enable_thinking": false}}
extra_body =
